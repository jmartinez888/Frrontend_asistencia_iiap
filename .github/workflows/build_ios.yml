name: Compilar para Apple (iPhone, iPad y Mac)

on:
  workflow_dispatch:
  push:
    branches: [ main, master, staging, frontend_development, Frontend_developer, feature/events-management, 'feature/**' ]

jobs:
  build-apple:
    name: Compilar para iOS y macOS
    runs-on: macos-14

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # --- COMPILACIÓN PARA IPHONE E IPAD ---
      - name: Preparar configuración de iOS
        run: flutter build ios --config-only --release

      - name: Compilar App para iOS (sin firma vía xcodebuild)
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios_build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Crear archivo IPA para iPhone / iPad
        run: |
          RUNNER_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          echo "Found Runner.app at: $RUNNER_PATH"
          mkdir -p Payload
          cp -r "$RUNNER_PATH" Payload/
          zip -r control_asistencia.ipa Payload
          rm -rf Payload

      - name: Subir IPA de iOS (iPhone / iPad)
        uses: actions/upload-artifact@v4
        with:
          name: control_asistencia_ios_ipa
          path: control_asistencia.ipa
          retention-days: 7

      # --- COMPILACIÓN PARA MAC ---
      - name: Compilar App para macOS
        run: flutter build macos --release

      - name: Firmar Ad-Hoc y Comprimir App de macOS
        run: |
          codesign --force --deep --sign - --entitlements macos/Runner/Release.entitlements build/macos/Build/Products/Release/control_asistencia.app
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/control_asistencia.app control_asistencia_macos.zip

      - name: Subir App para macOS
        uses: actions/upload-artifact@v4
        with:
          name: control_asistencia_macos
          path: control_asistencia_macos.zip
          retention-days: 7
