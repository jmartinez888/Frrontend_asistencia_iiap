name: control_asistencia
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  http_parser: ^4.0.2
  shared_preferences: ^2.2.2
  image_picker: ^1.1.2
  google_sign_in: 6.2.1
  geolocator: ^13.0.1
  flutter_local_notifications: ^17.2.2
  pdf: ^3.11.1
  printing: ^5.13.2
  local_auth: ^2.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/wallpapers/
